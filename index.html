<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Budget — Gestion des opérations</title>
<link rel="stylesheet" href="styles.css">
</head>
<body>
<header>
  <h1>Budget — opérations d'acquisition</h1>
  <nav class="tabs">
    <button type="button" class="tab active" data-tab="operations">Opérations</button>
    <button type="button" class="tab" data-tab="sdg">Référentiel SDG</button>
  </nav>
</header>
<main>
  <section class="panel active" data-panel="operations">
    <div class="toolbar">
      <label for="op-file-input"><button type="button" id="import-ops" onclick="document.getElementById('op-file-input').click()">Importer CSV</button></label>
      <input type="file" id="op-file-input" accept=".csv,.txt">
      <button type="button" id="export-ops">Exporter CSV</button>
      <button type="button" id="add-op" class="primary">+ Ligne</button>
      <button type="button" id="clear-ops" class="danger">Tout effacer</button>
    </div>
    <div class="totals" id="op-totals"></div>
    <table>
      <thead><tr id="op-head"></tr></thead>
      <tbody id="op-body"></tbody>
      <tfoot><tr id="op-foot"></tr></tfoot>
    </table>
  </section>

  <section class="panel" data-panel="sdg">
    <div class="toolbar">
      <label for="sdg-file-input"><button type="button" id="import-sdg" onclick="document.getElementById('sdg-file-input').click()">Importer CSV</button></label>
      <input type="file" id="sdg-file-input" accept=".csv,.txt">
      <button type="button" id="export-sdg">Exporter CSV</button>
      <button type="button" id="clear-sdg" class="danger">Tout effacer</button>
    </div>
    <div class="totals" id="sdg-totals"></div>
    <table>
      <thead><tr id="sdg-head"></tr></thead>
      <tbody id="sdg-body"></tbody>
    </table>
  </section>
</main>
<div class="msg" id="msg"></div>

<script src="src/schema.js"></script>
<script src="src/storage.js"></script>
<script src="src/app.js"></script>
</body>
</html>
