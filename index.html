<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Budget — Gestion des opérations</title>
<link rel="stylesheet" href="styles.css">
</head>
<body>
<header>
  <h1>Budget — opérations d'acquisition</h1>
  <label for="file-input"><button type="button" id="import-csv">Importer CSV</button></label>
  <input type="file" id="file-input" accept=".csv,.txt">
  <button id="export-csv">Exporter CSV</button>
  <button id="add-row" class="primary">+ Ligne</button>
  <button id="clear-all" class="danger">Tout effacer</button>
</header>
<main>
  <div class="totals" id="totals"></div>
  <table id="budget-table">
    <thead><tr id="head-row"></tr></thead>
    <tbody id="table-body"></tbody>
    <tfoot><tr id="foot-row"></tr></tfoot>
  </table>
</main>
<div class="msg" id="msg"></div>

<script src="src/schema.js"></script>
<script src="src/storage.js"></script>
<script src="src/app.js"></script>
</body>
</html>
